<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Human.ua 11-A • Halloween Edition</title>
    <style>
        :root {
            --bg-dark: #0a0512;
            --card-bg: #160c26;
            --card-border: rgba(255, 117, 24, 0.25);
            --accent-orange: #ff7518;
            --accent-purple: #9d4edd;
            --accent-green: #38b000;
            --accent-red: #d90429;
            --text-main: #f8f9fa;
            --text-muted: #b1a7a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 15%, rgba(255, 117, 24, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 80% 85%, rgba(157, 78, 221, 0.15) 0%, transparent 45%);
            background-attachment: fixed;
        }

        /* --- SPLASH SCREEN ANIMATION --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #05020a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s;
        }

        .pumpkin-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pumpkin {
            font-size: 90px;
            cursor: pointer;
            animation: swayPumpkin 1.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 25px rgba(255, 117, 24, 0.9));
            user-select: none;
        }

        @keyframes swayPumpkin {
            0% {
                transform: rotate(-12deg) scale(1);
                filter: drop-shadow(0 0 15px rgba(255, 117, 24, 0.7));
            }
            100% {
                transform: rotate(12deg) scale(1.08);
                filter: drop-shadow(0 0 35px rgba(255, 117, 24, 1));
            }
        }

        .pumpkin-explode {
            animation: explodePumpkin 0.6s forwards ease-out !important;
        }

        @keyframes explodePumpkin {
            0% {
                transform: scale(1);
                opacity: 1;
                filter: drop-shadow(0 0 30px rgba(255, 117, 24, 1));
            }
            50% {
                transform: scale(2.2);
                opacity: 0.9;
                filter: drop-shadow(0 0 80px rgba(255, 255, 255, 1));
            }
            100% {
                transform: scale(3.5);
                opacity: 0;
                filter: drop-shadow(0 0 120px rgba(255, 117, 24, 0));
            }
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: var(--accent-orange);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            box-shadow: 0 0 10px var(--accent-orange);
        }

        .splash-text {
            margin-top: 25px;
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-orange);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255, 117, 24, 0.6);
        }

        /* --- APP HEADER & UI --- */
        header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(10, 5, 18, 0.9);
            backdrop-filter: blur(12px);
            position: sticky;
            top: 0;
            z-index: 50;
            border-bottom: 1px solid var(--card-border);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: white;
            box-shadow: 0 0 15px rgba(255, 117, 24, 0.5);
        }

        .user-details h1 {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
        }

        .user-details p {
            font-size: 12px;
            color: var(--text-muted);
        }

        main {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .timer-box {
            background: linear-gradient(135deg, rgba(255, 117, 24, 0.18), rgba(157, 78, 221, 0.2));
            border: 1px solid rgba(255, 117, 24, 0.4);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
            text-align: center;
            box-shadow: 0 0 20px rgba(255, 117, 24, 0.15);
        }

        .timer-title {
            font-size: 13px;
            color: var(--accent-orange);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 4px;
        }

        .timer-time {
            font-size: 30px;
            font-weight: 800;
            color: #ffffff;
            margin: 4px 0;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 0 10px rgba(255, 117, 24, 0.4);
        }

        .timer-sub {
            font-size: 12px;
            color: var(--text-muted);
        }

        .day-picker {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }

        .day-picker::-webkit-scrollbar {
            display: none;
        }

        .day-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            flex: 1;
            text-align: center;
        }

        .day-btn.active {
            background: linear-gradient(135deg, var(--accent-orange), #e65c00);
            color: #ffffff;
            border-color: var(--accent-orange);
            box-shadow: 0 0 12px rgba(255, 117, 24, 0.4);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--accent-orange);
            font-weight: 700;
        }

        .lesson-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .lesson-main {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .lesson-num {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            background: rgba(255, 117, 24, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            color: var(--accent-orange);
            border: 1px solid rgba(255, 117, 24, 0.3);
        }

        .lesson-name {
            font-weight: 600;
            font-size: 14px;
            flex: 1;
            margin-left: 10px;
        }

        .cabinet-badge {
            background: rgba(157, 78, 221, 0.2);
            color: #c084fc;
            border: 1px solid rgba(157, 78, 221, 0.4);
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 8px;
            font-weight: 600;
        }

        .lesson-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 4px;
            margin-left: 36px;
        }

        .hw-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 10px;
            color: var(--text-main);
            font-size: 12px;
            margin-top: 8px;
            outline: none;
        }

        .grade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .grade-input {
            width: 80px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 6px;
            color: var(--text-main);
            text-align: center;
            font-size: 13px;
        }

        .gpa-card {
            background: linear-gradient(135deg, rgba(157, 78, 221, 0.2), rgba(255, 117, 24, 0.2));
            border: 1px solid var(--accent-purple);
            border-radius: 16px;
            padding: 16px;
            text-align: center;
            margin-bottom: 16px;
        }

        .gpa-num {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-orange);
            text-shadow: 0 0 10px rgba(255, 117, 24, 0.5);
        }

        .profile-field {
            margin-bottom: 12px;
        }

        .profile-field label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .profile-field input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 10px;
            color: var(--text-main);
            font-size: 14px;
        }

        .btn-pumpkin {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-orange), #e65c00);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 0 15px rgba(255, 117, 24, 0.3);
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 5, 18, 0.92);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 14px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 10px;
        }

        .nav-item.active {
            color: var(--accent-orange);
            background: rgba(255, 117, 24, 0.12);
        }
    </style>
</head>
<body>

    <!-- SPLASH SCREEN ANIMATION -->
    <div id="splash-screen">
        <div class="pumpkin-wrapper" id="pumpkin-container">
            <div class="pumpkin" id="pumpkin">🎃</div>
        </div>
        <div class="splash-text">Human.ua 11-A</div>
    </div>

    <header>
        <div class="user-info">
            <div class="avatar" id="avatar-display">11-А</div>
            <div class="user-details">
                <h1 id="user-name-display">Учень</h1>
                <p id="user-class-display">11-А клас • Halloween 🎃</p>
            </div>
        </div>
        <div style="font-size: 22px; cursor: pointer;" onclick="replaySplash()">🎃</div>
    </header>

    <main>
        <div class="timer-box">
            <div class="timer-title" id="timer-status">Завантаження...</div>
            <div class="timer-time" id="timer-clock">00:00:00</div>
            <div class="timer-sub" id="timer-info">Поточний час та урок</div>
        </div>

        <!-- TAB 1: HOME -->
        <div id="tab-home" class="tab-content active">
            <div class="day-picker">
                <button class="day-btn" onclick="selectDay('Понеділок')">Пн</button>
                <button class="day-btn" onclick="selectDay('Вівторок')">Вт</button>
                <button class="day-btn" onclick="selectDay('Середа')">Ср</button>
                <button class="day-btn" onclick="selectDay('Четвер')">Чт</button>
                <button class="day-btn" onclick="selectDay('П\'ятниця')">Пт</button>
            </div>

            <div class="card">
                <div class="card-header">
                    <div class="card-title" id="selected-day-title">📌 Розклад</div>
                </div>
                <div id="day-lessons-list"></div>
            </div>
        </div>

        <!-- TAB 2: SCHEDULE -->
        <div id="tab-schedule" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">📅 Повний розклад 11-А</div>
                </div>
                <div id="full-schedule-container"></div>
            </div>
        </div>

        <!-- TAB 3: GRADES -->
        <div id="tab-grades" class="tab-content">
            <div class="gpa-card">
                <div style="font-size: 12px; color: var(--text-muted); text-transform: uppercase;">Середній бал</div>
                <div class="gpa-num" id="gpa-val">0.0</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-title">📊 Журнал оцінок</div>
                </div>
                <div id="grades-list"></div>
            </div>
        </div>

        <!-- TAB 4: PROFILE -->
        <div id="tab-profile" class="tab-content">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">⚙️ Налаштування профілю</div>
                </div>
                <div class="profile-field">
                    <label>Ім'я та Прізвище</label>
                    <input type="text" id="input-profile-name" value="Учень" oninput="saveProfile()">
                </div>
                <div class="profile-field">
                    <label>Клас</label>
                    <input type="text" id="input-profile-class" value="11-А" oninput="saveProfile()">
                </div>
                <button class="btn-pumpkin" onclick="replaySplash()">🎃 Переглянути анімацію гарбуза</button>
            </div>
        </div>
    </main>

    <nav>
        <div class="nav-item active" id="nav-home" onclick="switchTab('home')">
            <span>🎃 Головна</span>
        </div>
        <div class="nav-item" id="nav-schedule" onclick="switchTab('schedule')">
            <span>📅 Розклад</span>
        </div>
        <div class="nav-item" id="nav-grades" onclick="switchTab('grades')">
            <span>📊 Оцінки</span>
        </div>
        <div class="nav-item" id="nav-profile" onclick="switchTab('profile')">
            <span>⚙️ Профіль</span>
        </div>
    </nav>

    <script>
        const schedule11A = {
            "Понеділок": [
                { name: "Українська мова", cab: "К" },
                { name: "Мистецтво", cab: "К" },
                { name: "Англійська мова", cab: "10" },
                { name: "Зарубіжна література", cab: "2" },
                { name: "Фізика", cab: "9" },
                { name: "Математика", cab: "5" },
                { name: "Фізична культура", cab: "С/З" }
            ],
            "Вівторок": [
                { name: "Інформатика", cab: "3" },
                { name: "Хімія", cab: "10" },
                { name: "Біологія", cab: "К" },
                { name: "Математика", cab: "К" },
                { name: "Англійська мова", cab: "5" },
                { name: "Фізика", cab: "9" },
                { name: "Українська література", cab: "10" }
            ],
            "Середа": [
                { name: "Математика", cab: "К" },
                { name: "Англійська мова", cab: "5" },
                { name: "Англійська мова", cab: "1" },
                { name: "Історія України", cab: "К" },
                { name: "Фізика", cab: "9" },
                { name: "Фізична культура", cab: "С/З" }
            ],
            "Четвер": [
                { name: "Захист України", cab: "ЗЗСО №1" },
                { name: "Захист України", cab: "ЗЗСО №1" },
                { name: "Географія", cab: "К" },
                { name: "Українська мова", cab: "10" },
                { name: "Фізична культура", cab: "С/З" },
                { name: "Українська література", cab: "6" }
            ],
            "П'ятниця": [
                { name: "Англійська мова", cab: "1" },
                { name: "Біологія", cab: "7" },
                { name: "Фізика", cab: "К" },
                { name: "Мистецтво", cab: "К" },
                { name: "Всесвітня історія", cab: "К" },
                { name: "Хімія", cab: "10" }
            ]
        };

        const bellSchedule = [
            { start: "08:00", end: "08:45" },
            { start: "08:55", end: "09:40" },
            { start: "09:50", end: "10:35" },
            { start: "10:45", end: "11:30" },
            { start: "11:40", end: "12:25" },
            { start: "12:35", end: "13:20" },
            { start: "13:30", end: "14:15" }
        ];

        let currentSelectedDay = "Понеділок";

        function timeToMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function triggerPumpkinExplosion() {
            const pumpkin = document.getElementById('pumpkin');
            const container = document.getElementById('pumpkin-container');

            for (let i = 0; i < 25; i++) {
                let particle = document.createElement('div');
                particle.className = 'particle';
                container.appendChild(particle);

                let angle = Math.random() * Math.PI * 2;
                let distance = 60 + Math.random() * 100;
                let x = Math.cos(angle) * distance;
                let y = Math.sin(angle) * distance;

                particle.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${x}px, ${y}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 600,
                    easing: 'cubic-bezier(0, .9, .57, 1)',
                    fill: 'forwards'
                });
            }

            pumpkin.classList.add('pumpkin-explode');

            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
            }, 500);
        }

        function replaySplash() {
            const splash = document.getElementById('splash-screen');
            const pumpkin = document.getElementById('pumpkin');
            pumpkin.classList.remove('pumpkin-explode');
            splash.style.visibility = 'visible';
            splash.style.opacity = '1';
            setTimeout(triggerPumpkinExplosion, 1800);
        }

        function updateRealTimeTimer() {
            const now = new Date();
            const days = ["Неділя", "Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота"];
            const currentDayName = days[now.getDay()];
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const currentSeconds = now.getSeconds();

            const statusEl = document.getElementById('timer-status');
            const clockEl = document.getElementById('timer-clock');
            const infoEl = document.getElementById('timer-info');

            const dayLessons = schedule11A[currentDayName];

            if (!dayLessons) {
                statusEl.innerText = "🏖️ Вихідний день";
                clockEl.innerText = now.toLocaleTimeString('uk-UA');
                infoEl.innerText = `${currentDayName}, уроків немає`;
                return;
            }

            let found = false;
            for (let i = 0; i < dayLessons.length && i < bellSchedule.length; i++) {
                let startMins = timeToMinutes(bellSchedule[i].start);
                let endMins = timeToMinutes(bellSchedule[i].end);

                if (currentMinutes >= startMins && currentMinutes < endMins) {
                    let totalSecsRemaining = (endMins - currentMinutes) * 60 - currentSeconds;
                    let mins = Math.floor(totalSecsRemaining / 60);
                    let secs = totalSecsRemaining % 60;

                    statusEl.innerText = `🔔 До кінця ${i + 1}-го уроку (${dayLessons[i].name})`;
                    clockEl.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                    infoEl.innerText = `Каб. ${dayLessons[i].cab} • Триває урок`;
                    found = true;
                    break;
                }

                if (i < dayLessons.length - 1 && i < bellSchedule.length - 1) {
                    let nextStartMins = timeToMinutes(bellSchedule[i + 1].start);
                    if (currentMinutes >= endMins && currentMinutes < nextStartMins) {
                        let totalSecsRemaining = (nextStartMins - currentMinutes) * 60 - currentSeconds;
                        let mins = Math.floor(totalSecsRemaining / 60);
                        let secs = totalSecsRemaining % 60;

                        statusEl.innerText = `☕ Перерва! До уроку №${i + 2}`;
                        clockEl.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                        infoEl.innerText = `Наступний: ${dayLessons[i + 1].name} (Каб. ${dayLessons[i + 1].cab})`;
                        found = true;
                        break;
                    }
                }
            }

            if (!found) {
                let firstStartMins = timeToMinutes(bellSchedule[0].start);
                if (currentMinutes < firstStartMins) {
                    let totalSecsRemaining = (firstStartMins - currentMinutes) * 60 - currentSeconds;
                    let hours = Math.floor(totalSecsRemaining / 3600);
                    let mins = Math.floor((totalSecsRemaining % 3600) / 60);
                    let secs = totalSecsRemaining % 60;

                    statusEl.innerText = "🌅 До початку 1-го уроку";
                    clockEl.innerText = `${hours.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                    infoEl.innerText = `Перший урок: ${dayLessons[0].name} (Каб. ${dayLessons[0].cab})`;
                } else {
                    statusEl.innerText = "🎃 Навчальний день завершено!";
                    clockEl.innerText = now.toLocaleTimeString('uk-UA');
                    infoEl.innerText = `${currentDayName} • Всі уроки пройшли`;
                }
            }
        }

        function selectDay(dayName) {
            currentSelectedDay = dayName;
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText.trim() === getShortDay(dayName));
            });

            document.getElementById('selected-day-title').innerText = `📌 Розклад на ${dayName}`;
            const container = document.getElementById('day-lessons-list');
            container.innerHTML = '';

            const lessons = schedule11A[dayName] || [];
            lessons.forEach((lesson, idx) => {
                const timeSlot = bellSchedule[idx] ? `${bellSchedule[idx].start} - ${bellSchedule[idx].end}` : '---';
                const hwSaved = localStorage.getItem(`hw_${dayName}_${idx}`) || '';
                container.innerHTML += `
                    <div class="lesson-item">
                        <div class="lesson-main">
                            <div class="lesson-num">${idx + 1}</div>
                            <div class="lesson-name">${lesson.name}</div>
                            <div class="cabinet-badge">${lesson.cab}</div>
                        </div>
                        <div class="lesson-time">⏰ ${timeSlot}</div>
                        <input type="text" class="hw-input" placeholder="Домашнє завдання..." 
                            value="${hwSaved}" oninput="saveHW('${dayName}', ${idx}, this.value)">
                    </div>
                `;
            });
        }

        function getShortDay(fullDay) {
            const map = {
                "Понеділок": "Пн",
                "Вівторок": "Вт",
                "Середа": "Ср",
                "Четвер": "Чт",
                "П'ятниця": "Пт"
            };
            return map[fullDay] || "Пн";
        }

        function renderFullSchedule() {
            const container = document.getElementById('full-schedule-container');
            container.innerHTML = '';

            for (const [day, lessons] of Object.entries(schedule11A)) {
                let dayHtml = `<div style="font-size: 15px; font-weight: 700; color: var(--accent-orange); margin: 14px 0 10px 0;">🗓️ ${day}</div>`;
                lessons.forEach((lesson, idx) => {
                    const timeSlot = bellSchedule[idx] ? `${bellSchedule[idx].start} - ${bellSchedule[idx].end}` : '---';
                    dayHtml += `
                        <div class="lesson-item">
                            <div class="lesson-main">
                                <div class="lesson-num">${idx + 1}</div>
                                <div class="lesson-name">${lesson.name}</div>
                                <div class="cabinet-badge">${lesson.cab}</div>
                            </div>
                            <div class="lesson-time">⏰ ${timeSlot}</div>
                        </div>
                    `;
                });
                container.innerHTML += dayHtml;
            }
        }

        function renderGrades() {
            const allSubjects = new Set();
            for (const lessons of Object.values(schedule11A)) {
                lessons.forEach(l => allSubjects.add(l.name));
            }

            const container = document.getElementById('grades-list');
            container.innerHTML = '';
            let total = 0;
            let count = 0;

            allSubjects.forEach(subject => {
                const savedGrade = localStorage.getItem(`grade_${subject}`) || '';
                if (savedGrade) {
                    const num = parseFloat(savedGrade);
                    if (!isNaN(num)) {
                        total += num;
                        count++;
                    }
                }

                container.innerHTML += `
                    <div class="grade-item">
                        <span style="font-size: 13px; font-weight: 600;">${subject}</span>
                        <input type="text" class="grade-input" placeholder="Бали" value="${savedGrade}" 
                            oninput="saveGrade('${subject}', this.value)">
                    </div>
                `;
            });

            const gpa = count > 0 ? (total / count).toFixed(1) : "0.0";
            document.getElementById('gpa-val').innerText = gpa;
        }

        function saveHW(day, idx, value) {
            localStorage.setItem(`hw_${day}_${idx}`, value);
        }

        function saveGrade(subject, value) {
            localStorage.setItem(`grade_${subject}`, value);
            renderGrades();
        }

        function saveProfile() {
            const name = document.getElementById('input-profile-name').value || "Учень";
            const cls = document.getElementById('input-profile-class').value || "11-А";

            localStorage.setItem('user_name', name);
            localStorage.setItem('user_class', cls);

            document.getElementById('user-name-display').innerText = name;
            document.getElementById('user-class-display').innerText = `${cls} клас • Halloween 🎃`;
            document.getElementById('avatar-display').innerText = cls;
        }

        function loadProfile() {
            const name = localStorage.getItem('user_name') || "Учень";
            const cls = localStorage.getItem('user_class') || "11-А";

            document.getElementById('input-profile-name').value = name;
            document.getElementById('input-profile-class').value = cls;

            document.getElementById('user-name-display').innerText = name;
            document.getElementById('user-class-display').innerText = `${cls} клас • Halloween 🎃`;
            document.getElementById('avatar-display').innerText = cls;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            document.getElementById(`tab-${tabId}`).classList.add('active');
            document.getElementById(`nav-${tabId}`).classList.add('active');
            window.scrollTo(0, 0);
        }

        window.onload = () => {
            setTimeout(triggerPumpkinExplosion, 2200);

            const days = ["Неділя", "Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота"];
            const today = days[new Date().getDay()];
            currentSelectedDay = schedule11A[today] ? today : "Понеділок";

            loadProfile();
            selectDay(currentSelectedDay);
            renderFullSchedule();
            renderGrades();
            updateRealTimeTimer();
            setInterval(updateRealTimeTimer, 1000);
        };
    </script>
</body>
</html>
