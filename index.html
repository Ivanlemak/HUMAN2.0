<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Human.ua Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-purple: #7f00ff;
            --accent-pink: #ff007f;
            --accent-green: #00ff87;
            --accent-yellow: #ffb703;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            padding-bottom: 90px;
            min-height: 100vh;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .neon-text-cyan { color: var(--accent-cyan); text-shadow: 0 0 10px rgba(0, 242, 254, 0.4); }
        .neon-text-purple { color: var(--accent-purple); text-shadow: 0 0 10px rgba(127, 0, 255, 0.4); }
        .neon-text-green { color: var(--accent-green); text-shadow: 0 0 10px rgba(0, 255, 135, 0.4); }
        .neon-text-yellow { color: var(--accent-yellow); text-shadow: 0 0 10px rgba(255, 183, 3, 0.4); }

        .timer-badge {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: var(--accent-cyan);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-green);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .time-display {
            font-size: 2.2rem;
            font-weight: 800;
            text-align: center;
            margin: 10px 0;
            letter-spacing: 1px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            height: 8px;
            width: 100%;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
            border-radius: 10px;
            width: 0%;
            transition: width 0.5s ease;
        }

        .day-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 12px;
            scrollbar-width: none;
        }

        .day-tab {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
        }

        .day-tab.active {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: #fff;
            border-color: transparent;
            box-shadow: 0 0 12px rgba(79, 172, 254, 0.4);
        }

        .schedule-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 8px;
            border-left: 3px solid transparent;
        }

        .schedule-item.active-lesson {
            background: rgba(0, 242, 254, 0.08);
            border-left-color: var(--accent-cyan);
        }

        .lesson-num {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            width: 24px;
        }

        .lesson-info { flex-grow: 1; padding: 0 10px; }
        .lesson-title { font-weight: 600; font-size: 0.9rem; }
        .lesson-time { font-size: 0.75rem; color: var(--text-muted); }

        .room-badge {
            font-size: 0.7rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 3px 8px;
            border-radius: 6px;
            color: var(--accent-cyan);
        }

        .profile-banner { display: flex; align-items: center; gap: 12px; }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            border: 2px solid var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        .level-badge {
            background: linear-gradient(90deg, var(--accent-yellow), #f72585);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #000;
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .achievement-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .achievement-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .ach-unlocked {
            background: rgba(0, 255, 135, 0.15);
            color: var(--accent-green);
            border: 1px solid rgba(0, 255, 135, 0.3);
        }

        .ach-details { overflow: hidden; }

        .ach-title {
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ach-sub { font-size: 0.65rem; color: var(--text-muted); }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(11, 15, 25, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--card-border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-muted);
            font-size: 0.7rem;
            cursor: pointer;
        }

        .nav-item.active { color: var(--accent-cyan); }
    </style>
</head>
<body>

    <!-- User Header -->
    <div class="card">
        <div class="profile-banner">
            <div class="avatar" id="user-avatar">В</div>
            <div style="flex-grow: 1;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-weight: 700;" id="user-name">Ваня</span>
                    <span class="level-badge">11-А Клас</span>
                </div>
                <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); margin-top: 6px;">
                    <span>XP: 750 / 1000</span>
                    <span class="neon-text-green">+50 XP за відвідуваність</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" style="width: 75%;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Live Timer Widget -->
    <div class="card">
        <div class="card-header">
            <div class="card-title neon-text-cyan">
                <i data-lucide="clock"></i> Розклад та Таймер
            </div>
            <div class="timer-badge">
                <div class="pulse-dot"></div>
                <span>Урок триває</span>
            </div>
        </div>

        <div style="text-align: center; font-size: 0.85rem; color: var(--text-muted);">
            Зараз: Українська мова (Школа)
        </div>
        <div class="time-display" id="countdown-timer">12:45</div>
        
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="lesson-progress-bar" style="width: 65%;"></div>
        </div>

        <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); margin-top: 6px;">
            <span>08:00</span>
            <span>08:45</span>
        </div>
    </div>

    <!-- Schedule Section -->
    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <i data-lucide="calendar"></i> Розклад 11-А
            </div>
        </div>

        <div class="day-tabs">
            <div class="day-tab active" onclick="selectDay(this, 'Mon')">ПН</div>
            <div class="day-tab" onclick="selectDay(this, 'Tue')">ВТ</div>
            <div class="day-tab" onclick="selectDay(this, 'Wed')">СР</div>
            <div class="day-tab" onclick="selectDay(this, 'Thu')">ЧТ</div>
            <div class="day-tab" onclick="selectDay(this, 'Fri')">ПТ</div>
        </div>

        <div id="schedule-list"></div>
    </div>

    <!-- Achievements Section -->
    <div class="card">
        <div class="card-header">
            <div class="card-title neon-text-yellow">
                <i data-lucide="trophy"></i> Досягнення
            </div>
            <span style="font-size: 0.75rem; color: var(--text-muted);">3 / 8 здобуто</span>
        </div>

        <div class="achievements-grid">
            <div class="achievement-card">
                <div class="achievement-icon ach-unlocked">
                    <i data-lucide="award"></i>
                </div>
                <div class="ach-details">
                    <div class="ach-title">Відмінник</div>
                    <div class="ach-sub">3 десятки поспіль</div>
                </div>
            </div>

            <div class="achievement-card">
                <div class="achievement-icon ach-unlocked">
                    <i data-lucide="zap"></i>
                </div>
                <div class="ach-details">
                    <div class="ach-title">Пунктуальний</div>
                    <div class="ach-sub">Без запізнень</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="nav-bar">
        <div class="nav-item active">
            <i data-lucide="home"></i>
            <span>Головна</span>
        </div>
        <div class="nav-item">
            <i data-lucide="book-check"></i>
            <span>Оцінки</span>
        </div>
        <div class="nav-item">
            <i data-lucide="check-square"></i>
            <span>ДЗ</span>
        </div>
        <div class="nav-item">
            <i data-lucide="user"></i>
            <span>Профіль</span>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();

            const user = window.Telegram.WebApp.initDataUnsafe?.user;
            if (user) {
                document.getElementById('user-name').innerText = user.first_name || 'Ваня';
                document.getElementById('user-avatar').innerText = user.first_name ? user.first_name[0] : 'В';
            }
        }

        lucide.createIcons();

        const schedules = {
            'Mon': [
                { num: 1, name: 'Українська мова', room: 'Школа', active: true },
                { num: 2, name: 'Мистецтво', room: 'Школа', active: false },
                { num: 3, name: 'Англійська мова', room: 'Школа', active: false },
                { num: 4, name: 'Зарубіжна літ.', room: 'Школа', active: false },
                { num: 5, name: 'Фізика', room: 'Школа', active: false },
                { num: 6, name: 'Математика', room: 'Школа', active: false },
                { num: 7, name: 'Фізична культура', room: 'Школа', active: false }
            ],
            'Tue': [
                { num: 1, name: 'Інформатика', room: 'Комбінат', active: false },
                { num: 2, name: 'Хімія', room: 'Комбінат', active: false },
                { num: 3, name: 'Біологія', room: 'Комбінат', active: false },
                { num: 4, name: 'Математика', room: 'Школа', active: false },
                { num: 5, name: 'Англійська мова', room: 'Школа', active: false },
                { num: 6, name: 'Фізика', room: 'Школа', active: false },
                { num: 7, name: 'Українська літ.', room: 'Комбінат', active: false }
            ],
            'Wed': [
                { num: 1, name: 'Математика', room: 'Комбінат', active: false },
                { num: 2, name: 'Англійська мова', room: 'Комбінат', active: false },
                { num: 3, name: 'Англійська мова', room: 'Комбінат', active: false },
                { num: 4, name: 'Історія України', room: 'Комбінат', active: false },
                { num: 5, name: 'Фізика', room: 'Школа', active: false },
                { num: 6, name: 'Фізична культура', room: 'Школа', active: false }
            ],
            'Thu': [
                { num: 1, name: 'Захист України', room: 'Школа', active: false },
                { num: 2, name: 'Захист України', room: 'Школа', active: false },
                { num: 3, name: 'Географія', room: 'Комбінат', active: false },
                { num: 4, name: 'Українська мова', room: 'Школа', active: false },
                { num: 5, name: 'Фізична культура', room: 'Комбінат', active: false },
                { num: 6, name: 'Українська літ.', room: 'Школа', active: false }
            ],
            'Fri': [
                { num: 1, name: 'Англійська мова', room: 'Комбінат', active: false },
                { num: 2, name: 'Біологія', room: 'Школа', active: false },
                { num: 3, name: 'Фізика', room: 'Школа', active: false },
                { num: 4, name: 'Мистецтво', room: 'Школа', active: false },
                { num: 5, name: 'Всесвітня історія', room: 'Школа', active: false },
                { num: 6, name: 'Хімія', room: 'Школа', active: false }
            ]
        };

        function renderSchedule(day) {
            const list = document.getElementById('schedule-list');
            list.innerHTML = '';
            
            const items = schedules[day] || [];
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = `schedule-item ${item.active ? 'active-lesson' : ''}`;
                div.innerHTML = `
                    <div class="lesson-num">${item.num}</div>
                    <div class="lesson-info">
                        <div class="lesson-title">${item.name}</div>
                    </div>
                    <div class="room-badge">${item.room}</div>
                `;
                list.appendChild(div);
            });
        }

        function selectDay(element, day) {
            document.querySelectorAll('.day-tab').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');
            renderSchedule(day);
        }

        renderSchedule('Mon');

        // Simple Countdown Visual Simulation
        let duration = 12 * 60 + 45;
        setInterval(() => {
            if (duration <= 0) duration = 45 * 60;
            const m = Math.floor(duration / 60);
            const s = duration % 60;
            document.getElementById('countdown-timer').innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            duration--;
        }, 1000);
    </script>
</body>
</html>
